<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Hexagon outline -->
  <polygon
    points="256,68 388,143 388,293 256,368 124,293 124,143"
    fill="none"
    stroke="url(#grad)"
    stroke-width="18"
    stroke-linejoin="round"
    opacity="0.5"
  />

  <!-- Chart line (portfolio curve) -->
  <polyline
    points="148,340 196,248 230,290 268,188 308,230 364,148"
    fill="none"
    stroke="url(#grad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dot on last point -->
  <circle cx="364" cy="148" r="14" fill="#00d4ff"/>
</svg>
